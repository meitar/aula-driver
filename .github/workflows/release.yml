name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build & Publish Release Assets
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build aula-cli Universal Binary
        run: |
          swift build -c release --product aula-cli --triple arm64-apple-macosx
          swift build -c release --product aula-cli --triple x86_64-apple-macosx
          mkdir -p dist
          lipo -create -output dist/aula-cli \
            .build/arm64-apple-macosx/release/aula-cli \
            .build/x86_64-apple-macosx/release/aula-cli
          cd dist
          tar -czvf aula-cli-${{ github.ref_name }}-macos.tar.gz aula-cli
          cd ..

      - name: Build AulaDriverApp Universal Binary
        run: |
          swift build -c release --product AulaDriverApp --triple arm64-apple-macosx
          swift build -c release --product AulaDriverApp --triple x86_64-apple-macosx
          mkdir -p .build/universal/release
          lipo -create -output .build/universal/release/AulaDriverApp \
            .build/arm64-apple-macosx/release/AulaDriverApp \
            .build/x86_64-apple-macosx/release/AulaDriverApp
          ./scripts/bundle_app.sh "${{ github.ref_name }}"
          zip -r dist/AulaDriverApp-${{ github.ref_name }}.zip AulaDriverApp.app

      - name: Generate Checksums
        run: |
          cd dist
          shasum -a 256 *.tar.gz *.zip > checksums.txt
          cat checksums.txt
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/aula-cli-${{ github.ref_name }}-macos.tar.gz
            dist/AulaDriverApp-${{ github.ref_name }}.zip
            dist/checksums.txt
          generate_release_notes: true
