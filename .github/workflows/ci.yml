name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Run Test Suite
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and Run Tests
        run: |
          swift build
          swift run aula-test-runner
